[project]
name = "bord4-analysis-templates"
version = "0.1.0"
description = "Project used to hold templates for the bord4 analysis cookiecutter"
authors = [{ name = "Lasse Lambrechts", email = "lasse.lambrechts@bt.no" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.19",
    "ipykernel>=7.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "pakkenellik>=0.2.1",
    "pandas>=3.0.0,<4",
    "python-dotenv>=0.21.0",
    "requests>=2.28.1",
]

[project.urls]
Homepage = "https://github.com/BergensTidende/bord4-analysis-templates"

[dependency-groups]
dev = [
    "mypy>=0.991",
    "ruff>=0.6.0",
    "types-requests>=2.28.11.7",
]
gis = [
    "fiona>=1.8.22",
    "folium>=0.14.0",
    "geopandas>=0.12.2",
    "mapclassify>=2.4.3",
    "owslib>=0.27.2",
    "pakkenellik[gis]>=0.2.1",
]
gsheet = [
    "pakkenellik[gspread]>=0.2.1",
]
nvdb = [
    "nvdbapi-v3>=1.0.0",
    "pakkenellik[nvdb]>=0.2.1",
]
publish = [
    "pakkenellik[datawrapper]>=0.2.1",
]
scraping = [
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "selenium>=4.7.2",
]
ssb = [
    "pakkenellik[ssb]>=0.2.1",
]
viz = [
    "matplotlib>=3.9.3",
    "pakkenellik[viz]>=0.2.1",
    "plotly>=5.11.0",
    "seaborn>=0.13.0",
]

[tool.uv]
package = false
required-version = ">=0.13.5"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"templates/eda-*.py" = ["E402", "F401", "F821"]
"templates/etl-*.py" = ["E402", "F401", "F821"]
"templates/generic-header.py" = ["E402", "F401", "F821"]
"templates/publish-*.py" = ["E402", "F401", "F821"]

[tool.mypy]
# 3rd party import
ignore_missing_imports = true
# dynamic typing
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = true
disallow_any_generics = false
disallow_subclassing_any = true
# platform
python_version = "3.11"
# untyped
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# None and Optional
no_implicit_optional = true
# Warnings
warn_return_any = false
warn_unreachable = true
# Misc
pretty = true
