[project]
name = "bord4-analysis-templates"
version = "0.1.1"
description = "Versioned analysis templates and a template installer for Bord4"
authors = [{ name = "Lasse Lambrechts", email = "lasse.lambrechts@bt.no" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["analysis", "data", "templates", "bord4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/BergensTidende/bord4-analysis-templates"
Issues = "https://github.com/BergensTidende/bord4-analysis-templates/issues"

[project.scripts]
b4-template = "bord4_analysis_templates.cli:main"

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "hatchling>=1.27.0",
    "mypy>=1.15.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]
analysis = [
    "certifi>=2026.10.19",
    "ipykernel>=7.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "pakkenellik>=0.2.4",
    "pandas>=3.0.0,<4",
    "python-dotenv>=0.21.0",
    "requests>=2.28.1",
]
gis = [
    { include-group = "analysis" },
    "fiona>=1.8.22",
    "folium>=0.14.0",
    "geopandas>=0.12.2",
    "mapclassify>=2.4.3",
    "owslib>=0.27.2",
    "pakkenellik[gis]>=0.2.4",
]
gsheet = [
    { include-group = "analysis" },
    "pakkenellik[gspread]>=0.2.4",
]
nvdb = [
    { include-group = "analysis" },
    "nvdbapi-v3>=1.0.0",
    "pakkenellik[nvdb]>=0.2.4",
]
publish = [
    { include-group = "analysis" },
    "pakkenellik[datawrapper]>=0.2.4",
]
scraping = [
    { include-group = "analysis" },
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "selenium>=4.7.2",
]
ssb = [
    { include-group = "analysis" },
    "pakkenellik[ssb]>=0.2.4",
]
viz = [
    { include-group = "analysis" },
    "matplotlib>=3.9.3",
    "pakkenellik[viz]>=0.2.4",
    "plotly>=5.11.0",
    "seaborn>=0.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"templates/eda-*.py" = ["E402", "F401", "F821"]
"templates/etl-*.py" = ["E402", "F401", "F821"]
"templates/generic-header.py" = ["E402", "F401", "F821"]
"templates/publish-*.py" = ["E402", "F401", "F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
ignore_missing_imports = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = true
disallow_any_generics = false
disallow_subclassing_any = true
python_version = "3.11"
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = false
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bord4_analysis_templates"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "bord4_analysis_templates/templates"
"templates.toml" = "bord4_analysis_templates/templates.toml"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/src",
    "/templates",
    "/templates.toml",
    "/tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
