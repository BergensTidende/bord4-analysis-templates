name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff format
        run: uv run ruff format --check src tests templates

      - name: Ruff lint
        run: uv run ruff check src tests templates

      - name: Mypy
        run: uv run mypy --config-file pyproject.toml src

      - name: Tests
        run: uv run pytest

      - name: Build
        run: uv build
